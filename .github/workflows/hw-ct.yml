name: hw-ct

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  hardware:
    strategy:
      fail-fast: false
      matrix:
        # "z" is the pinned profile; downstream deployments build at "s".
        opt: ["s", "z"]
    uses: kaidokert/krabi-caliper-rs/.github/workflows/hw-ct.yml@hw-ct-v1
    with:
      invocation-name: fixed-bigint-opt-${{ matrix.opt }}
      campaigns-json: '["fixed-bigint-jtrace-f407"]'
      working-directory: ct-verify/cyccnt-hardware
      prepared: true
      opt-level: ${{ matrix.opt }}
