name: CT Verify

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  panic-audit:
    strategy:
      fail-fast: false
      matrix:
        triple: [thumbv7m-none-eabi, riscv32imc-unknown-none-elf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: ${{ matrix.triple }}
          components: llvm-tools-preview
      - name: Install krabi-caliper
        run: cargo install krabi-caliper --version 0.1.0 --features cli,campaign
      - name: Run panic-free audit
        run: |
          cargo krabi-caliper panic-audit \
            --workspace . \
            --package panic-free-audit \
            --target ${{ matrix.triple }} \
            --negative-features neg-controls \
            --owned-symbol '.*' \
            --expect-negative panic_audit__neg__bounds_check \
            --expect-negative panic_audit__neg__unwrap \
            --expect-negative panic_audit__neg__expect \
            --json target/panic-audit/${{ matrix.triple }}.json

  ct:
    strategy:
      fail-fast: false
      matrix:
        # "z" is the pinned profile; downstream deployments build at "s",
        # where inlining moves helper bodies into the fixtures.
        opt: ["s", "z"]
        triple:
          - thumbv7em-none-eabi # Priority 1: Cortex-M3/M4
          - thumbv7m-none-eabi
          - thumbv6m-none-eabi # Priority 2: Cortex-M0
          - riscv32imc-unknown-none-elf # Priority 3: 32-bit RISC-V
          - riscv32imac-unknown-none-elf
          - avr-none # Priority 4
          - aarch64-unknown-linux-gnu # Priority 5
          - x86_64-unknown-linux-gnu # Priority 6
        include:
          # +lzcnt,+bmi1 mirrors ct-ctgrind.yml: baseline-x86_64 lowers
          # `u32::leading_zeros()` to `test/je/bsr` (bsr undefined on
          # zero, hence the `je`), a real data-dependent branch in the std
          # intrinsic. BMI1 is on Haswell+ (2013) and every GitHub Actions
          # x86_64 runner.
          - triple: x86_64-unknown-linux-gnu
            extra_rustflags: "-C target-feature=+lzcnt,+bmi1"
          # AVR is nightly-only (build-std + target-cpu). Pinned nightly;
          # see #197. Must match the avr toolchain in ct-driver's target.rs.
          # Nightly defaults to v0 symbol mangling; the helper allowlist is
          # written against the legacy form stable still emits.
          - triple: avr-none
            toolchain: nightly-2026-08-05
            extra_components: rust-src
            extra_rustflags: "-C target-cpu=atmega328p -Z unstable-options -C symbol-mangling-version=legacy"
    runs-on: ubuntu-latest
    name: ${{ matrix.triple }} (opt ${{ matrix.opt }})
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain || '1.88' }}
          # AVR is tier 3 — rust-std isn't published as a downloadable
          # component, so `rustup target add avr-none` fails. We build
          # core from source via -Z build-std=core (see rust-src below)
          # so the precompiled std isn't needed.
          #
          # NB: GitHub Actions ternary needs polarity-flip here. The
          # natural `X == 'avr-none' && '' || X` short-circuits to X
          # because `''` is falsy in `||`. The form below resolves to
          # `''` on AVR and `X` everywhere else.
          targets: ${{ matrix.triple != 'avr-none' && matrix.triple || '' }}
          components: llvm-tools-preview${{ matrix.extra_components && ', ' || '' }}${{ matrix.extra_components }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ct-verify-${{ matrix.triple }}-${{ matrix.opt }}

      - name: Scope per-target RUSTFLAGS to the cross-build
        # Cargo recognises CARGO_TARGET_<TRIPLE>_RUSTFLAGS (triple
        # uppercased with `-` → `_`) and applies it only when building
        # for that target. We compute the var name here so each matrix
        # row's `extra_rustflags` lands in the right place without
        # leaking into the host ct-driver compile.
        if: matrix.extra_rustflags != ''
        run: |
          name="CARGO_TARGET_$(echo '${{ matrix.triple }}' | tr 'a-z-' 'A-Z_')_RUSTFLAGS"
          echo "$name=${{ matrix.extra_rustflags }}" >> "$GITHUB_ENV"

      - name: Run ct-driver
        run: cargo run --release -p ct-driver -- --target ${{ matrix.triple }} --json-out target/ct-report/${{ matrix.triple }}-${{ matrix.opt }}.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ct-report-${{ matrix.triple }}-${{ matrix.opt }}
          path: target/ct-report/
          retention-days: 30
